<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>Leka — Your AI Money Coach</title>
<meta name="description" content="Leka is an AI money coach for students and young adults in Africa."/>
<meta name="theme-color" content="#060E09"/>
<meta property="og:type" content="website"/>
<meta property="og:title" content="Leka — your free AI money coach"/>
<meta property="og:description" content="Budget, track spends and hit your savings goals, in English or Pidgin."/>
<meta property="og:image" content="./og.png"/>
<meta name="twitter:card" content="summary_large_image"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Leka"/>
<link rel="manifest" href="./manifest.json"/>
<link rel="icon" type="image/png" href="./icons/icon-192.png"/>
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png"/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:wght@400;500;600;700&family=DM+Mono&display=swap" rel="stylesheet">
<style>
:root{--bg:#060E09;--panel:#0C1F10;--panel2:#081509;--lime:#F4C430;--gold:#2ECC71;--text:#E8F4EC;--muted:#7FA88D;--line:rgba(255,255,255,.08);--danger:#FF6B6B;--blue:#5B8DEF}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:'DM Sans',system-ui,sans-serif}
body{padding-bottom:calc(76px + env(safe-area-inset-bottom))}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
.shell{max-width:760px;margin:auto;min-height:100vh}
.top{position:sticky;top:0;z-index:20;padding:calc(12px + env(safe-area-inset-top)) 18px 12px;background:rgba(6,14,9,.92);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:10px;font-family:'Syne',sans-serif;font-weight:800;font-size:1.1rem}
.mark{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--lime);color:var(--bg)}
.iconbtn{height:36px;padding:0 12px;border-radius:12px;border:1px solid var(--line);background:var(--panel);font-size:.8rem;font-weight:600}
.content{padding:20px 18px 12px}
.view{display:none}.view.active{display:block}
.hello{font-size:.85rem;color:var(--muted)}
h1{font-family:'Syne',sans-serif;font-size:1.9rem;line-height:1.05;margin:.25rem 0 1.1rem}
.hero{background:linear-gradient(145deg,#12351d,#09140b);border:1px solid rgba(46,204,113,.18);border-radius:22px;padding:20px}
.eyebrow{font-size:.7rem;color:var(--muted);font-family:'DM Mono',monospace;text-transform:uppercase;letter-spacing:.08em}
.money{font:800 2.2rem 'Syne',sans-serif;margin:.3rem 0}
.sub{font-size:.85rem;color:var(--muted);line-height:1.5}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px}
.card b.big{font-family:'Syne',sans-serif;font-size:1.25rem;display:block;margin-top:4px}
.card p{margin:.35rem 0 0;color:var(--muted);font-size:.8rem;line-height:1.45}
.section-title{font-family:'Syne',sans-serif;font-weight:700;margin:22px 0 10px;display:flex;justify-content:space-between;align-items:center}
.pill{font:600 .68rem 'DM Mono',monospace;color:var(--lime);border:1px solid rgba(46,204,113,.24);background:rgba(46,204,113,.08);padding:4px 8px;border-radius:99px}
.pill.gold{color:var(--gold);border-color:rgba(244,196,48,.3);background:rgba(244,196,48,.08)}
.ask{display:flex;gap:9px}
.ask input{flex:1;min-width:0;border-radius:14px;padding:14px;background:rgba(255,255,255,.05);border:1px solid var(--line);outline:none;font-size:16px}
.ask input:focus{border-color:var(--lime)}
.send{border:0;background:var(--lime);color:var(--bg);font-weight:800;padding:0 18px;border-radius:14px;font-size:1.05rem}
.send:disabled{opacity:.45}
.tip{margin-top:12px;background:rgba(244,196,48,.07);border:1px solid rgba(244,196,48,.16);border-radius:16px;padding:14px}
.tip strong{color:var(--gold);font:600 .7rem 'DM Mono',monospace;letter-spacing:.06em}
.tip p{margin:.4rem 0 0;line-height:1.5;font-size:.9rem;color:var(--text)}
.progress{height:8px;background:rgba(255,255,255,.07);border-radius:99px;overflow:hidden;margin-top:12px}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--lime),var(--gold));border-radius:99px;transition:width .6s}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row small{color:var(--muted)}
.amt{font-family:'DM Mono',monospace;font-size:.85rem;white-space:nowrap}
.bar{height:6px;background:rgba(255,255,255,.07);border-radius:99px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--lime);border-radius:99px}
.chat{display:flex;flex-direction:column;height:calc(100vh - 150px - env(safe-area-inset-top) - env(safe-area-inset-bottom));height:calc(100dvh - 150px - env(safe-area-inset-top) - env(safe-area-inset-bottom));min-height:360px}
.messages{flex:1;overflow:auto;display:flex;flex-direction:column;gap:10px;padding:4px 0 12px}
.msg{max-width:88%;padding:11px 14px;border-radius:16px;font-size:.93rem;line-height:1.5;word-wrap:break-word;white-space:pre-wrap}
.bot{align-self:flex-start;background:var(--panel);border:1px solid rgba(46,204,113,.12);border-bottom-left-radius:4px}
.user{align-self:flex-end;background:rgba(46,204,113,.15);border:1px solid rgba(46,204,113,.22);border-bottom-right-radius:4px}
.tiny{font:700 .6rem 'DM Mono',monospace;color:var(--lime);text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px;white-space:normal}
.typing span{display:inline-block;width:6px;height:6px;margin-right:3px;border-radius:50%;background:var(--muted);animation:b 1s infinite}
.typing span:nth-child(2){animation-delay:.15s}.typing span:nth-child(3){animation-delay:.3s}
@keyframes b{0%,60%,100%{opacity:.3}30%{opacity:1}}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid rgba(46,204,113,.22);background:rgba(46,204,113,.07);color:var(--lime);border-radius:99px;padding:7px 12px;font-size:.8rem}
.chip.sel{background:var(--lime);color:var(--bg)}
.primary,.secondary{width:100%;border-radius:14px;padding:13px;border:0;font-weight:700;margin-top:10px;display:block;text-align:center;text-decoration:none;font-size:.95rem}
.primary{background:var(--lime);color:var(--bg)}
.secondary{background:var(--panel);border:1px solid var(--line);color:var(--text)}
.primary:disabled{opacity:.5}
.linkbtn{background:none;border:0;color:var(--lime);font-weight:600;padding:0;font-size:.85rem}
.empty{text-align:center;padding:26px 16px}
.empty .e{font-size:2rem}
.empty p{color:var(--muted);font-size:.88rem;line-height:1.5;margin:.5rem 0 0}
.offline{display:none;position:fixed;left:50%;transform:translateX(-50%);top:calc(10px + env(safe-area-inset-top));z-index:99;background:#402a08;color:#ffd978;border:1px solid rgba(244,196,48,.35);padding:7px 12px;border-radius:99px;font-size:.75rem;white-space:nowrap}
.offline.show{display:block}
.bottom{position:fixed;bottom:0;left:0;right:0;z-index:30;background:rgba(6,14,9,.96);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom));display:flex;justify-content:center}
.nav{max-width:760px;width:100%;display:grid;grid-template-columns:repeat(5,1fr)}
.nav button{border:0;background:none;color:var(--muted);padding:6px 2px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:2px;font-size:.66rem;font-weight:600}
.nav button b{font-size:1.2rem;font-weight:400;line-height:1.2}
.nav button.active{color:var(--lime)}
.sheet-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:60}
.sheet-bg.show{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:61;max-width:760px;margin:auto;background:var(--panel2);border:1px solid var(--line);border-bottom:0;border-radius:22px 22px 0 0;padding:18px 18px calc(22px + env(safe-area-inset-bottom));transform:translateY(105%);visibility:hidden;transition:transform .25s ease,visibility .25s}
.sheet.show{transform:none;visibility:visible}
.sheet h3{font-family:'Syne',sans-serif;margin:0 0 4px;font-size:1.25rem}
.field{margin-top:12px}
.field label{display:block;font-size:.75rem;color:var(--muted);margin-bottom:6px}
.field input{width:100%;border-radius:12px;padding:13px;background:rgba(255,255,255,.05);border:1px solid var(--line);outline:none;font-size:16px}
.field input:focus{border-color:var(--lime)}
.code{font:800 2.4rem 'DM Mono',monospace;letter-spacing:.18em;text-align:center;margin:14px 0 4px;color:var(--lime)}
.keybox{font:.78rem 'DM Mono',monospace;background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:10px;padding:10px;word-break:break-all;margin-top:8px}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);opacity:0;background:#10301a;border:1px solid rgba(46,204,113,.3);padding:10px 16px;border-radius:12px;font-size:.85rem;z-index:80;transition:all .25s;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%)}
.boot{position:fixed;inset:0;background:var(--bg);display:grid;place-items:center;z-index:100;text-align:center;padding:24px}
.boot.hide{display:none}
.boot .mark{width:64px;height:64px;font-size:1.8rem;margin:0 auto 14px;border-radius:18px}
.status-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--gold);margin-right:6px}
.status-dot.on{background:var(--lime)}
.share-img{width:100%;border-radius:14px;border:1px solid var(--line);margin-top:12px;display:block;max-height:52vh;object-fit:contain;background:#0a1a0e}
.toggle{display:flex;align-items:center;gap:10px;margin-top:12px;font-size:.9rem}
.toggle input{width:20px;height:20px;accent-color:var(--lime)}
.btnrow{display:flex;justify-content:space-between;align-items:center;margin-top:10px}
.prompt{margin-top:12px;border:1px solid rgba(46,204,113,.25);background:rgba(46,204,113,.06);border-radius:16px;padding:14px}
.prompt p{margin:.3rem 0 0;color:var(--muted);font-size:.85rem;line-height:1.45}
@media(min-width:760px){.shell{border-left:1px solid var(--line);border-right:1px solid var(--line)}.bottom{left:50%;width:760px;transform:translateX(-50%);border:1px solid var(--line);border-bottom:0;border-radius:20px 20px 0 0}}

/* Leka brand refinement: gold-led identity with green financial accents. */
.mark{background:linear-gradient(135deg,#F4C430,#ffe189);color:#07110b;box-shadow:0 8px 26px rgba(244,196,48,.22)}
.top{background:rgba(6,14,9,.94);border-bottom-color:rgba(244,196,48,.10)}
.hero{background:radial-gradient(circle at 85% 15%,rgba(244,196,48,.13),transparent 15rem),linear-gradient(145deg,#12351d,#09140b);border-color:rgba(244,196,48,.18)}
.primary,.send{background:linear-gradient(135deg,#F4C430,#ffd95f);color:#07110b;box-shadow:0 8px 24px rgba(244,196,48,.12)}
.primary:hover,.send:hover{filter:brightness(1.04)}
.bot{border-color:rgba(244,196,48,.12)}
.user{background:rgba(244,196,48,.12);border-color:rgba(244,196,48,.20)}
.chip{border-color:rgba(244,196,48,.22);background:rgba(244,196,48,.07)}
.tip{background:rgba(46,204,113,.06);border-color:rgba(46,204,113,.16)}
.bottom{border-top-color:rgba(244,196,48,.10)}
.toast{background:#173219;border-color:rgba(46,204,113,.30)}
</style>
</head>
<body>
<div id="boot" class="boot"><div><div class="mark">L</div><div id="bootMsg" class="sub">Loading Leka…</div><button id="bootRetry" class="primary" style="display:none;max-width:220px;margin:16px auto 0" onclick="location.reload()">Try again</button></div></div>
<div id="offline" class="offline">You're offline · showing your last saved data</div>
<div class="shell">
<header class="top">
  <div class="brand"><div class="mark">L</div>Leka</div>
  <div style="display:flex;gap:8px"><button id="installTop" class="iconbtn" style="display:none" onclick="doInstall()">Install</button><button class="iconbtn" onclick="shareLeka()">Share</button></div>
</header>
<main class="content">

<section class="view active" data-view="home" id="v-home"></section>
<section class="view" data-view="budget" id="v-budget"></section>

<section class="view" data-view="leka">
  <div class="chat">
    <div id="messages" class="messages"></div>
    <div id="chips" class="chips"></div>
    <div class="ask"><input id="chatInput" placeholder="Ask Leka about your money…" enterkeyhint="send" autocomplete="off"/><button id="sendBtn" class="send" onclick="sendChat()" aria-label="Send">➜</button></div>
  </div>
</section>

<section class="view" data-view="goals" id="v-goals"></section>
<section class="view" data-view="profile" id="v-profile"></section>

</main></div>

<nav class="bottom"><div class="nav">
  <button class="active" data-target="home"><b>⌂</b>Home</button>
  <button data-target="budget"><b>▥</b>Budget</button>
  <button data-target="leka"><b>✦</b>Leka</button>
  <button data-target="goals"><b>◎</b>Goals</button>
  <button data-target="profile"><b>◉</b>Me</button>
</div></nav>

<div id="sheetBg" class="sheet-bg" onclick="closeSheet()"></div>
<div id="sheet" class="sheet"></div>
<div id="toast" class="toast"></div>

<script>
/* ── CONFIG ── */
const API = 'https://kobacoach-production.up.railway.app/api';
const APP_URL = new URL('./app.html', location.href).href;

/* ── STATE ── */
let TOKEN = null, ME = null, busy = false, deferredPrompt = null, linkPoll = null;
const PUSH_OK = 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
const IS_IOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
const STANDALONE = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
let pushOn = false, shareCanvas = null, shareGoal = null;
const CAT = {food:'🍔',transport:'🚌',rent:'🏠',entertainment:'🎮',data:'📱',clothing:'👕',health:'💊',savings:'💰',other:'🧾'};

/* ── STORAGE ── */
const store = {
  get(k){try{return localStorage.getItem(k)}catch(e){return null}},
  set(k,v){try{localStorage.setItem(k,v)}catch(e){}},
  del(k){try{localStorage.removeItem(k)}catch(e){}}
};

/* ── HELPERS ── */
const $ = (id) => document.getElementById(id);
const esc = (t) => String(t ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtBot = (t) => esc(t).replace(/\*([^*\n]+)\*/g,'<strong>$1</strong>').replace(/(^|\s)_([^_\n]+)_/g,'$1<em>$2</em>');
const CURRENCIES = {
  NGN:{symbol:'₦',label:'Nigerian Naira'}, ZAR:{symbol:'R',label:'South African Rand'},
  USD:{symbol:'$',label:'US Dollar'}, KES:{symbol:'KSh',label:'Kenyan Shilling'}, GHS:{symbol:'₵',label:'Ghanaian Cedi'}
};
const curCode = () => (ME && ME.user && ME.user.currency_code) || null;
const cur = () => (ME && ME.user && ME.user.currency) || (curCode() && CURRENCIES[curCode()] ? CURRENCIES[curCode()].symbol : '');
const money = (n, source = null) => {
  const code = source && source.currency_code;
  const symbol = (source && source.currency) || (code && CURRENCIES[code] ? CURRENCIES[code].symbol : '') || cur();
  return symbol + Math.round(Number(n)||0).toLocaleString('en-US');
};
const sum = (a, f) => a.reduce((s, x) => s + (Number(f(x)) || 0), 0);
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),2800);}
function when(iso){const d=new Date(iso),n=new Date();const days=Math.floor((new Date(n.toDateString())-new Date(d.toDateString()))/864e5);return days===0?'Today':days===1?'Yesterday':d.toLocaleDateString('en-GB',{day:'numeric',month:'short'});}
function greet(){const h=new Date().getHours();return h<12?'Good morning':h<17?'Good afternoon':'Good evening';}

/* ── API ── */
async function api(path, opts = {}) {
  const ctrl = new AbortController(); const to = setTimeout(() => ctrl.abort(), opts.timeout || 45000);
  try {
    const r = await fetch(API + path, {
      method: opts.method || 'GET',
      headers: { 'Content-Type': 'application/json', ...(TOKEN ? { Authorization: 'Bearer ' + TOKEN } : {}) },
      body: opts.body ? JSON.stringify(opts.body) : undefined,
      signal: ctrl.signal
    });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) { const e = new Error(d.error || ('Error ' + r.status)); e.status = r.status; throw e; }
    return d;
  } finally { clearTimeout(to); }
}

/* ── BOOT ── */
async function boot() {
  TOKEN = store.get('koba_token');
  const cached = store.get('koba_me');
  if (cached) { try { ME = JSON.parse(cached); renderAll(); $('boot').classList.add('hide'); } catch (e) {} }
  try {
    if (!TOKEN) {
      const ref = new URLSearchParams(location.search).get('ref') || store.get('koba_ref');
      let tz = null; try { tz = Intl.DateTimeFormat().resolvedOptions().timeZone; } catch (e) {}
      const d = await api('/session', { method: 'POST', body: { ref, tz } });
      TOKEN = d.token; store.set('koba_token', TOKEN); store.del('koba_ref');
    }
    await refresh();
    await checkPush(); renderHome(); renderProfile();
    $('boot').classList.add('hide');
    if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(()=>{});
    if (!ME.user.onboarded && !ME.messages.length && !location.hash) showView('leka');
  } catch (e) {
    if (e.status === 401) { store.del('koba_token'); store.del('koba_me'); TOKEN = null; ME = null; return boot(); }
    if (!ME) { $('bootMsg').textContent = navigator.onLine ? "Couldn't reach Leka right now." : "You're offline. Connect to the internet to start."; $('bootRetry').style.display = 'block'; }
  }
}

async function refresh() {
  ME = await api('/me');
  store.set('koba_me', JSON.stringify(ME));
  renderAll();
  celebrate();
}
function celebrate(){
  let done = []; try { done = JSON.parse(store.get('koba_celebrated') || '[]'); } catch (e) {}
  const g = ME.goals.find(x => Number(x.target_amount) > 0 && Number(x.saved_amount) >= Number(x.target_amount) && !done.includes(String(x.id)));
  if (!g || $('sheet').classList.contains('show')) return;
  done.push(String(g.id)); store.set('koba_celebrated', JSON.stringify(done));
  setTimeout(() => openShareGoal(String(g.id), true), 500);
}

/* ── RENDER ── */
function renderAll(){ renderHome(); renderBudget(); renderGoals(); renderProfile(); renderChat(); }

function monthStats(){
  const spent = sum(ME.spends.filter(s => s.category !== 'savings'), s => s.amount);
  const savedLogged = sum(ME.spends.filter(s => s.category === 'savings'), s => s.amount);
  const income = ME.user.monthly_income;
  return { spent, savedLogged, income, left: income != null ? income - spent - savedLogged : null };
}

function renderHome(){
  const u = ME.user, st = monthStats();
  const name = u.name ? ', ' + esc(u.name.split(' ')[0]) : '';
  const goalsSaved = sum(ME.goals, g => g.saved_amount);
  const lastTip = [...ME.messages].reverse().find(m => m.role === 'assistant');
  const top = [...ME.goals].sort((a,b)=>(b.saved_amount/b.target_amount)-(a.saved_amount/a.target_amount))[0];

  let hero;
  if (st.income) {
    const pct = Math.min(100, Math.round((st.spent + st.savedLogged) / st.income * 100));
    hero = `<div class="hero"><div class="eyebrow">Left this month</div><div class="money" style="color:${st.left<0?'var(--danger)':'#fff'}">${money(st.left)}</div><div class="sub">Spent ${money(st.spent)} of ${money(st.income)} income</div><div class="progress"><i style="width:${pct}%"></i></div></div>`;
  } else {
    hero = `<div class="hero"><div class="eyebrow">Get started</div><div class="money" style="font-size:1.5rem">Tell Leka about your money</div><div class="sub">Share your monthly income and essentials in chat and this page fills in with your real numbers.</div><button class="primary" onclick="showView('leka')">Start with Leka</button></div>`;
  }

  $('v-home').innerHTML = `
    <div class="hello">${greet()}${name}</div><h1>${u.name ? 'Your money today' : 'Welcome to Leka 👋'}</h1>
    ${hero}
    <div class="grid2">
      <div class="card"><div class="eyebrow">Spent · ${new Date().toLocaleString('en-GB',{month:'short'})}</div><b class="big">${money(st.spent)}</b><p>${ME.spends.length} spend${ME.spends.length===1?'':'s'} logged</p></div>
      <div class="card"><div class="eyebrow">In goals</div><b class="big" style="color:var(--lime)">${money(goalsSaved)}</b><p>${ME.goals.length} active goal${ME.goals.length===1?'':'s'}</p></div>
    </div>
    <button class="primary" onclick="openSpendSheet()">+ Log a spend</button>

function addMsg(who, text){
  const d = document.createElement('div');
  d.className = 'msg ' + who;
  d.innerHTML = (who === 'bot' ? '<div class="tiny">Leka</div>' : '') + (who === 'bot' ? fmtBot(text) : esc(text));
  $('messages').appendChild(d); $('messages').scrollTop = $('messages').scrollHeight;
  return d;
}
async function sendChat(){
  const input = $('chatInput'), txt = input.value.trim();
  if (!txt || busy) return;
  if (!navigator.onLine) { toast("You're offline. Leka will be here when you reconnect."); return; }
  busy = true; $('sendBtn').disabled = true; $('messages').dataset.live = '1';
  addMsg('user', txt); input.value = '';
  const t = document.createElement('div'); t.className = 'msg bot typing'; t.innerHTML = '<span></span><span></span><span></span>';
  $('messages').appendChild(t); $('messages').scrollTop = $('messages').scrollHeight;
  try {
    const d = await api('/chat', { method: 'POST', body: { message: txt } });
    t.remove(); addMsg('bot', d.reply);
    refresh().then(() => { $('messages').dataset.live = '1'; renderChips(); }).catch(()=>{});
  } catch (e) {
    t.remove();
    addMsg('bot', e.status === 429 ? e.message : "I couldn't get that through. Check your connection and send it again.");
    input.value = txt;
  } finally { busy = false; $('sendBtn').disabled = false; }
}
function goLeka(text, send){

async function checkPush(){
  if (!PUSH_OK) return false;
  try { const reg = await navigator.serviceWorker.ready; pushOn = !!(await reg.pushManager.getSubscription()); } catch (e) { pushOn = false; }
  return pushOn;
}
function showPushPrompt(){
  return PUSH_OK && !pushOn && Notification.permission === 'default' && ME && ME.user.onboarded && store.get('koba_push_prompt') !== 'done';
}
function remindersHTML(){
  if (pushOn) return `<p style="margin-top:0">✅ Friday check-ins are on for this device.</p><div class="btnrow"><button class="linkbtn" onclick="testPush()">Send a test</button><button class="linkbtn" style="color:var(--muted)" onclick="disablePush()">Turn off</button></div>`;
  if (!PUSH_OK && IS_IOS && !STANDALONE) return '<p style="margin-top:0">On iPhone, add Leka to your Home Screen first (Share → Add to Home Screen), then open it from there to turn on reminders.</p>';
  if (!PUSH_OK) return '<p style="margin-top:0">This browser does not support reminders. Try Chrome on Android, or install Leka.</p>';
  if (Notification.permission === 'denied') return '<p style="margin-top:0">Notifications are blocked for Leka. Allow them in your browser or phone settings, then come back here.</p>';
  return `<p style="margin-top:0">Get your week's spending every Friday evening, and a gentle nudge if you go quiet for a few days.</p><button class="primary" onclick="enablePush()">Turn on reminders</button>`;
}
function b64ToU8(b){ const p = '='.repeat((4 - b.length % 4) % 4); const r = atob((b + p).replace(/-/g, '+').replace(/_/g, '/')); return Uint8Array.from([...r].map(c => c.charCodeAt(0))); }
async function enablePush(){
  if (!PUSH_OK) { toast(IS_IOS && !STANDALONE ? 'On iPhone, add Leka to your Home Screen first' : 'Reminders are not supported in this browser'); return; }
  try {
    const perm = await Notification.requestPermission();
    if (perm !== 'granted') { store.set('koba_push_prompt', 'done'); renderHome(); renderProfile(); toast('Notifications were not allowed'); return; }
    const { key } = await api('/push/key');
    if (!key) { toast('Reminders are not switched on yet'); return; }
    const reg = await navigator.serviceWorker.ready;
    let sub = await reg.pushManager.getSubscription();
    if (!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64ToU8(key) });
    await api('/push/subscribe', { method: 'POST', body: { subscription: sub.toJSON() } });
    pushOn = true; store.set('koba_push_prompt', 'done'); renderHome(); renderProfile(); toast('Reminders on ✅');
  } catch (e) { toast(e.message || "Couldn't turn on reminders"); }
}
async function disablePush(){
  try {
    const reg = await navigator.serviceWorker.ready; const sub = await reg.pushManager.getSubscription();
    if (sub) { await api('/push/unsubscribe', { method: 'POST', body: { endpoint: sub.endpoint } }).catch(() => {}); await sub.unsubscribe(); }
    pushOn = false; renderProfile(); toast('Reminders off');
  } catch (e) { toast("Couldn't turn off reminders"); }
}
async function testPush(){ try { const d = await api('/push/test', { method: 'POST' }); toast(d.sent ? 'Test sent 🔔' : 'No device subscribed'); } catch (e) { toast(e.message); } }

function rr(x, X, Y, w, h, r){ x.beginPath(); x.moveTo(X + r, Y); x.arcTo(X + w, Y, X + w, Y + h, r); x.arcTo(X + w, Y + h, X, Y + h, r); x.arcTo(X, Y + h, X, Y, r); x.arcTo(X, Y, X + w, Y, r); x.closePath(); }
function wrap(x, text, X, Y, maxW, lh, maxLines){
  const words = String(text).split(/\s+/); let line = '', lines = [];
  for (const w of words) { const t = line ? line + ' ' + w : w; if (x.measureText(t).width > maxW && line) { lines.push(line); line = w; } else line = t; }
  if (line) lines.push(line);
  if (lines.length > maxLines) { lines = lines.slice(0, maxLines); lines[maxLines - 1] = lines[maxLines - 1].replace(/\s*\S*$/, '') + '…'; }
  lines.forEach((l, i) => x.fillText(l, X, Y + i * lh)); return lines.length;
}
async function drawGoalCard(g, showAmt){
  try { await document.fonts.ready; } catch (e) {}
  const W = 1080, H = 1350, c = document.createElement('canvas'); c.width = W; c.height = H; const x = c.getContext('2d');
  const pct = g.target_amount ? Math.min(100, Math.round(g.saved_amount / g.target_amount * 100)) : 0, done = pct >= 100;
  const bg = x.createLinearGradient(0, 0, W, H); bg.addColorStop(0, '#12351d'); bg.addColorStop(1, '#060E09'); x.fillStyle = bg; x.fillRect(0, 0, W, H);
  x.fillStyle = 'rgba(46,204,113,.07)'; for (let i = 20; i < W; i += 44) for (let j = 20; j < H; j += 44) { x.beginPath(); x.arc(i, j, 2.2, 0, 7); x.fill(); }
  x.fillStyle = '#2ECC71'; rr(x, 80, 80, 92, 92, 26); x.fill();
  x.fillStyle = '#060E09'; x.font = '800 58px Syne, sans-serif'; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText('K', 126, 128);
  x.textAlign = 'left'; x.fillStyle = '#fff'; x.font = '800 50px Syne, sans-serif'; x.fillText('Leka', 196, 128);
  x.textBaseline = 'alphabetic';
  x.fillStyle = done ? '#F4C430' : '#7FA88D'; x.font = '600 46px "DM Sans", sans-serif'; x.fillText(done ? 'Goal reached!' : "I'm saving for", 80, 330);
  x.fillStyle = '#fff'; x.font = '800 94px Syne, sans-serif'; wrap(x, g.name, 80, 440, W - 160, 104, 2);
  const cx = W / 2, cy = 850, r = 205;
  x.lineWidth = 46; x.lineCap = 'round'; x.strokeStyle = 'rgba(255,255,255,.08)'; x.beginPath(); x.arc(cx, cy, r, 0, Math.PI * 2); x.stroke();
  if (pct > 0) { const rg = x.createLinearGradient(cx - r, cy, cx + r, cy); rg.addColorStop(0, '#2ECC71'); rg.addColorStop(1, '#F4C430'); x.strokeStyle = rg; x.beginPath(); x.arc(cx, cy, r, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * pct / 100); x.stroke(); }
  x.textAlign = 'center'; x.fillStyle = '#fff'; let fs = 118; x.font = `800 ${fs}px Syne, sans-serif`; while (x.measureText(pct + '%').width > r * 1.5 && fs > 60) { fs -= 4; x.font = `800 ${fs}px Syne, sans-serif`; } x.fillText(pct + '%', cx, cy + 20);
  x.fillStyle = '#7FA88D'; x.font = '500 36px "DM Sans", sans-serif';
  x.fillText(showAmt ? money(g.saved_amount) + ' of ' + money(g.target_amount) : (done ? 'saved' : 'of the way there'), cx, cy + 84);
  x.fillStyle = '#2ECC71'; x.font = '700 42px "DM Sans", sans-serif'; x.fillText('Budget smarter with Leka', cx, 1190);
  x.fillStyle = '#7FA88D'; x.font = '400 32px "DM Mono", monospace'; x.fillText('Free AI money coach · ' + location.host, cx, 1246);
  return c;
}
async function openShareGoal(id, celebrating){
  shareGoal = ME.goals.find(g => String(g.id) === String(id)); if (!shareGoal) return;
  const done = Number(shareGoal.saved_amount) >= Number(shareGoal.target_amount);
  openSheet(`<h3>${celebrating ? 'You did it! 🎉' : done ? 'Share your win' : 'Share your progress'}</h3>
    <div class="sub">${celebrating ? `You hit your ${esc(shareGoal.name)} goal. Tell your people, it might push them to start too.` : 'Friends see your progress, not your balance.'}</div>
    <img id="shareImg" class="share-img" alt="Goal progress card"/>
    <label class="toggle"><input type="checkbox" id="shareAmt" onchange="updateShareImg()"/> Show amounts</label>
    <button class="primary" onclick="doShareGoal()">Share</button><button class="secondary" onclick="closeSheet()">Close</button>`);
  await updateShareImg();
}
async function updateShareImg(){
  shareCanvas = await drawGoalCard(shareGoal, $('shareAmt') && $('shareAmt').checked);
  $('shareImg').src = shareCanvas.toDataURL('image/png');
}
function inviteUrl(){ const code = ME && ME.user.ref_code; return code ? APP_URL + '?ref=' + code : APP_URL; }
async function doShareGoal(){
  if (!shareCanvas || !shareGoal) return;
  const pct = Math.min(100, Math.round(shareGoal.saved_amount / shareGoal.target_amount * 100)) || 0;
  const text = (pct >= 100 ? `I just hit my ${shareGoal.name} goal with Leka 🎉` : `I'm ${pct}% of the way to my ${shareGoal.name} goal with Leka 💪`) + ' Free AI money coach: ' + inviteUrl();
  const blob = await new Promise(r => shareCanvas.toBlob(r, 'image/png'));
  const file = new File([blob], 'leka-goal.png', { type: 'image/png' });
  try {
    if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], text }); return; }
  } catch (e) { if (e.name === 'AbortError') return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'leka-goal.png'; document.body.appendChild(a); a.click(); a.remove();
  try { await navigator.clipboard.writeText(text); toast('Image saved · caption copied'); } catch (e) { toast('Image saved'); }
}

/* ── NAV ── */
function showView(name){
  const btn = document.querySelector('.nav button[data-target="'+name+'"]') || document.querySelector('.nav button[data-target="home"]');
  document.querySelectorAll('.nav button').forEach(b => b.classList.toggle('active', b === btn));
  document.querySelectorAll('.view').forEach(v => v.classList.toggle('active', v.dataset.view === btn.dataset.target));
  history.replaceState(null, '', location.pathname + location.search + '#' + btn.dataset.target);
  window.scrollTo(0, 0);
  if (btn.dataset.target === 'leka') { const m = $('messages'); m.scrollTop = m.scrollHeight; }
}
document.querySelectorAll('.nav button').forEach(b => b.addEventListener('click', () => showView(b.dataset.target)));
$('chatInput').addEventListener('keydown', e => { if (e.key === 'Enter') sendChat(); });

function setOnline(){ $('offline').classList.toggle('show', !navigator.onLine); if (navigator.onLine && TOKEN) refresh().catch(()=>{}); }
window.addEventListener('online', setOnline); window.addEventListener('offline', setOnline);
$('offline').classList.toggle('show', !navigator.onLine);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && TOKEN && !busy) refresh().catch(()=>{}); });
if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(()=>{}));

if (location.hash) { const h = location.hash.slice(1); if (h) showView(h); }
boot();
